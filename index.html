
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UMD Campus Disturbance Map</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    #legend {
      position: absolute;
      top: 10px;
      right: 10px;
      background: white;
      padding: 12px;
      border-radius: 6px;
      box-shadow: 0 1px 5px #777;
      z-index: 1000;
      font-size: 14px;
    }

    .dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 6px;
    }

    #status {
      position: absolute;
      bottom: 25px;
      left: 10px;
      background: white;
      padding: 10px;
      border-radius: 6px;
      z-index: 1000;
      font-size: 13px;
      max-width: 290px;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <div id="legend">
    <div>
      <span class="dot" style="background:red"></span>
      Active disturbance
    </div>
    <div>
      <span class="dot" style="background:gray"></span>
      Expired / resolved
    </div>
  </div>

  <div id="status">Loading disturbances...</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Create UMD map
    const map = L.map("map").setView(
      [38.9869, -76.9426], 15
    );

    L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
      {
        attribution: "Tiles &copy; Esri",
        maxZoom: 19
      }
    ).addTo(map);

    const statusBox = document.getElementById("status");
    const markers = L.layerGroup().addTo(map);

    // Escape text from external sources
    function escapeHTML(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // Check whether a disturbance has ended
    function isExpired(d) {
      if (
        d.status === "resolved" ||
        d.status === "expired" ||
        d.status === "completed"
      ) {
        return true;
      }

      if (!d.end_date) {
        return false;
      }

      const end = new Date(d.end_date + "T23:59:59");

      if (isNaN(end.getTime())) {
        return false;
      }

      return new Date() > end;
    }

    // Validate coordinates
    function validCoordinates(d) {
      if (
        d.lat === null ||
        d.lng === null ||
        d.lat === undefined ||
        d.lng === undefined ||
        d.lat === "" ||
        d.lng === ""
      ) {
        return false;
      }

      const lat = Number(d.lat);
      const lng = Number(d.lng);

      return (
        Number.isFinite(lat) &&
        Number.isFinite(lng) &&
        lat >= -90 &&
        lat <= 90 &&
        lng >= -180 &&
        lng <= 180
      );
    }

    // Draw disturbances
    function renderDisturbances(data) {
      markers.clearLayers();

      if (!Array.isArray(data)) {
        throw new Error("Expected a JSON array.");
      }

      let displayed = 0;
      let missingCoordinates = 0;
      let unverified = 0;

      data.forEach(function(d) {

        // Skip invalid records
        if (!d || typeof d !== "object") {
          return;
        }

        // Do not present unverified data as confirmed
        if (
          d.needs_review === true ||
          d.status === "needs_verification"
        ) {
          unverified++;
          return;
        }

        // Skip entries without GPS coordinates
        if (!validCoordinates(d)) {
          missingCoordinates++;
          return;
        }

        const expired = isExpired(d);
        const color = expired ? "gray" : "red";

        const marker = L.circleMarker(
          [Number(d.lat), Number(d.lng)],
          {
            radius: 9,
            fillColor: color,
            color: "#333",
            weight: 1,
            fillOpacity: expired ? 0.5 : 0.9
          }
        ).addTo(markers);

        marker.on("mouseover", function() {
          marker.setStyle({ weight: 3 });
        });

        marker.on("mouseout", function() {
          marker.setStyle({ weight: 1 });
        });

        const name = escapeHTML(d.name || "Unnamed disturbance");
        const type = escapeHTML(d.type || "Disturbance");
        const description = escapeHTML(d.description || "No description");
        const area = escapeHTML(d.area || "Unknown area");
        const start = escapeHTML(d.start_date || "Unknown");
        const end = escapeHTML(d.end_date || "Not specified");

        const statusText = expired
          ? "Expired / Resolved"
          : "Active / End date not reached";

        const source = typeof d.source_url === "string" &&
          /^https?:\/\//i.test(d.source_url)
          ? `<a href="${escapeHTML(d.source_url)}"
                 target="_blank" rel="noopener noreferrer">
               Original notice
             </a>`
          : "";

        const popup = `
          <div style="min-width:200px">
            <strong style="font-size:16px">${name}</strong>
            <hr>
            <b>Type:</b> ${type}<br>
            <b>Area:</b> ${area}<br>
            <b>Description:</b> ${description}<br>
            <b>Start:</b> ${start}<br>
            <b>End:</b> ${end}<br>
            <b>Status:</b> ${statusText}<br>
            ${source}
          </div>
        `;

        marker.bindPopup(popup);
        displayed++;
      });

      statusBox.innerHTML = `
        <b>UMD Disturbance Map</b><br>
        Total notices: ${data.length}<br>
        Mapped: ${displayed}<br>
        Missing coordinates: ${missingCoordinates}<br>
        Awaiting verification: ${unverified}
      `;

      if (displayed === 0) {
        statusBox.innerHTML += `
          <br><br>
          No verified disturbances with GPS
          coordinates are available.
        `;
      }
    }

    // Load real data from GitHub Pages
    async function loadDisturbances() {
      try {
        const response = await fetch(
          "./disturbances.json?t=" + Date.now(),
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();
        renderDisturbances(data);

      } catch (error) {
        console.error("Error loading disturbances:", error);

        statusBox.textContent =
          "Could not load disturbance data. Check the JSON file.";

      }
    }

    // Load immediately
    loadDisturbances();

    // Refresh every 5 minutes while page is open
    setInterval(loadDisturbances, 300000);

  </script>

</body>
</html>
