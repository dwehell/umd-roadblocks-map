
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UMD Roadblocks Map</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    #panel {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 310px;
      max-width: calc(100vw - 40px);
      max-height: 85vh;
      overflow-y: auto;
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 10px #777;
      z-index: 1000;
      font-size: 14px;
    }

    h3 {
      margin-top: 0;
    }

    select, button {
      width: 100%;
      padding: 9px;
      margin: 6px 0;
      box-sizing: border-box;
    }

    button {
      background: #b5121b;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:disabled {
      background: #aaa;
      cursor: default;
    }

    #message {
      font-size: 13px;
      margin-top: 10px;
      line-height: 1.5;
    }

    .dot {
      display: inline-block;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      margin-right: 5px;
    }

    .small {
      color: #555;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <div id="panel">
    <h3>UMD Roadblocks Map</h3>

    <div>
      <span class="dot" style="background:red"></span>
      Active / dated notice
    </div>

    <div>
      <span class="dot" style="background:gray"></span>
      Expired
    </div>

    <div>
      <span class="dot" style="background:orange"></span>
      Awaiting verification
    </div>

    <hr>

    <b>Place a disturbance</b>

    <select id="disturbanceSelect">
      <option value="">Loading notices...</option>
    </select>

    <button id="placeButton">
      Place selected notice on map
    </button>

    <button id="downloadButton">
      Download updated JSON
    </button>

    <div id="message">Loading disturbances...</div>

    <p class="small">
      Click a notice, select Place, then click its
      correct location on the map. Locations you
      place remain unverified until reviewed.
    </p>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Create the campus map
    const map = L.map("map").setView(
      [38.9869, -76.9426], 15
    );

    L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
      {
        attribution: "Tiles &copy; Esri",
        maxZoom: 19
      }
    ).addTo(map);

    const markerLayer = L.layerGroup().addTo(map);

    const select = document.getElementById(
      "disturbanceSelect"
    );

    const message = document.getElementById(
      "message"
    );

    let disturbances = [];
    let selectedIndex = null;
    let placing = false;

    // Prevent external text from being interpreted as HTML
    function escapeHTML(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // Validate latitude and longitude
    function hasCoordinates(d) {
      if (
        d.lat == null ||
        d.lng == null ||
        d.lat === "" ||
        d.lng === ""
      ) {
        return false;
      }

      const lat = Number(d.lat);
      const lng = Number(d.lng);

      return (
        Number.isFinite(lat) &&
        Number.isFinite(lng) &&
        lat >= -90 && lat <= 90 &&
        lng >= -180 && lng <= 180
      );
    }

    // Determine whether the notice has expired
    function isExpired(d) {
      if (
        d.status === "expired" ||
        d.status === "resolved" ||
        d.status === "completed"
      ) {
        return true;
      }

      if (!d.end_date) {
        return false;
      }

      const end = new Date(
        d.end_date + "T23:59:59"
      );

      return (
        !isNaN(end.getTime()) &&
        new Date() > end
      );
    }

    function needsVerification(d) {
      return (
        d.needs_review !== false ||
        d.status === "needs_verification"
      );
    }

    // Display all notices that have coordinates
    function renderMarkers() {
      markerLayer.clearLayers();

      let mapped = 0;
      let missing = 0;
      let review = 0;

      disturbances.forEach(function(d) {
        if (!hasCoordinates(d)) {
          missing++;
          return;
        }

        const expired = isExpired(d);
        const unverified = needsVerification(d);

        if (unverified) {
          review++;
        }

        const color = unverified
          ? "orange"
          : expired ? "gray" : "red";

        const marker = L.circleMarker(
          [Number(d.lat), Number(d.lng)],
          {
            radius: 9,
            color: "#333",
            weight: 1,
            fillColor: color,
            fillOpacity: 0.9
          }
        ).addTo(markerLayer);

        const name = escapeHTML(
          d.name || "Unnamed disturbance"
        );

        const type = escapeHTML(
          d.type || "Unknown"
        );

        const description = escapeHTML(
          d.description || "No description"
        );

        const area = escapeHTML(
          d.area || "Unknown"
        );

        const start = escapeHTML(
          d.start_date || "Unknown"
        );

        const end = escapeHTML(
          d.end_date || "Unknown"
        );

        const status = unverified
          ? "Awaiting verification"
          : expired
            ? "Expired"
            : "Not marked expired";

        marker.bindPopup(`
          <div style="min-width:200px">
            <strong>${name}</strong>
            <hr>
            <b>Type:</b> ${type}<br>
            <b>Area:</b> ${area}<br>
            <b>Description:</b> ${description}<br>
            <b>Start:</b> ${start}<br>
            <b>End:</b> ${end}<br>
            <b>Status:</b> ${status}
          </div>
        `);

        mapped++;
      });

      message.textContent =
        "Total notices: " + disturbances.length +
        " | Mapped: " + mapped +
        " | Missing coordinates: " + missing +
        " | Mapped awaiting verification: " + review;
    }

    // Populate the dropdown
    function updateDropdown() {
      select.innerHTML = "";

      disturbances.forEach(function(d, index) {
        const option = document.createElement(
          "option"
        );

        option.value = index;

        option.textContent =
          (d.name || "Unnamed notice") +
          (hasCoordinates(d) ? " (mapped)" : " (unmapped)");

        select.appendChild(option);
      });

      if (disturbances.length === 0) {
        const option = document.createElement(
          "option"
        );

        option.textContent = "No notices found";
        option.value = "";
        select.appendChild(option);
      }
    }

    // Start placing a selected notice
    document.getElementById(
      "placeButton"
    ).addEventListener("click", function() {
      if (!disturbances.length) {
        return;
      }

      selectedIndex = Number(select.value);

      if (
        !Number.isInteger(selectedIndex) ||
        !disturbances[selectedIndex]
      ) {
        return;
      }

      placing = true;

      message.textContent =
        "Click the correct location on the map for: " +
        disturbances[selectedIndex].name;
    });

    // Place the marker where the user clicks
    map.on("click", function(event) {
      if (!placing || selectedIndex === null) {
        return;
      }

      const d = disturbances[selectedIndex];

      d.lat = Number(
        event.latlng.lat.toFixed(6)
      );

      d.lng = Number(
        event.latlng.lng.toFixed(6)
      );

      // A manually selected point is not automatically verified.
      d.needs_review = true;
      d.coordinate_source = "manual_unverified";

      placing = false;
      selectedIndex = null;

      renderMarkers();
      updateDropdown();

      message.textContent =
        "Location placed. Review its accuracy, then download the updated JSON.";
    });

    // Export the current data
    document.getElementById(
      "downloadButton"
    ).addEventListener("click", function() {
      const json = JSON.stringify(
        disturbances, null, 2
      );

      const blob = new Blob(
        [json],
        { type: "application/json" }
      );

      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");
      link.href = url;
      link.download = "disturbances.json";

      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(function() {
        URL.revokeObjectURL(url);
      }, 1000);
    });

    // Load your real GitHub JSON
    async function loadDisturbances() {
      try {
        const response = await fetch(
          "./disturbances.json?t=" + Date.now(),
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error(
            "HTTP " + response.status
          );
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
          throw new Error(
            "Expected an array of disturbances"
          );
        }

        disturbances = data;

        updateDropdown();
        renderMarkers();

      } catch (error) {
        console.error(error);

        message.textContent =
          "Could not load disturbances.json: " +
          error.message;
      }
    }

    loadDisturbances();
  </script>

</body>
</html>
